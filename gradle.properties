# Conservative settings for a 2-CPU / ~7GB RAM build VM.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
systemProp.http.proxyHost=hatch-egress-proxy
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=hatch-egress-proxy
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.java.net.preferIPv4Stack=true
