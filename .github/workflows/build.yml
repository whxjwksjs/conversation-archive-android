name: Build and release APKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (must match versionName in app/build.gradle.kts)'
        required: true
        default: '1.2.0'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Diagnose repository reachability
        run: |
          echo "--- google maven AGP pom ---"
          curl -sS -o /dev/null -w "%{http_code} %{url_effective}\n" https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom || echo "CURL FAILED for google maven"
          echo "--- gradle plugin portal marker pom ---"
          curl -sS -o /dev/null -w "%{http_code} %{url_effective}\n" https://plugins.gradle.org/m2/com/android/application/com.android.application.gradle.plugin/8.5.2/com.android.application.gradle.plugin-8.5.2.pom || echo "CURL FAILED for plugin portal"
          echo "--- sdkmanager repo (known good) ---"
          curl -sS -o /dev/null -w "%{http_code} %{url_effective}\n" https://dl.google.com/android/repository/repository2-1.xml || echo "CURL FAILED for sdk repo"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APKs
        run: gradle :app:assembleDebug

      - name: Verify APK signatures and metadata
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$BT/apksigner" verify "$apk" && echo "SIGNATURE OK: $apk"
            "$BT/aapt" dump badging "$apk" | head -3
          done

      - name: Rename APKs
        run: |
          VERSION="${{ inputs.version || '1.2.0' }}"
          cd app/build/outputs/apk/debug
          for f in *.apk; do echo "found: $f"; done
          mv app-armeabi-v7a-debug.apk "convarchive-${VERSION}-debug-armeabi-v7a.apk"
          mv app-arm64-v8a-debug.apk "convarchive-${VERSION}-debug-arm64-v8a.apk"
          mv app-universal-debug.apk "convarchive-${VERSION}-debug-universal.apk"
          ls -la convarchive-*.apk

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version || '1.2.0' }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION - Conversation Archive for Android" \
            --notes "Conversation Archive v$VERSION - local-first Android app to capture, import, archive, and export conversations from Google Gemini, Google AI Studio, and Google Jules. No accounts, no API keys, no telemetry; everything stays on the device. IMPORTANT: these are DEBUG builds signed with the Android debug key. Android will warn about an unknown developer on install - that is expected for a debug build. Install the universal APK." \
            app/build/outputs/apk/debug/convarchive-*.apk
