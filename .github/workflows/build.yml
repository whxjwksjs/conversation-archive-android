---
name: Build and release APKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (must match versionName in app/build.gradle.kts)'
        required: true
        default: '1.2.0'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle-installs"
          unzip -q -o /tmp/gradle-8.7-bin.zip -d "$HOME/gradle-installs"
          echo "$HOME/gradle-installs/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Diagnose Gradle plugin resolution
        run: |
          echo "--- Java network test ---"
          mkdir -p /tmp/jtest
          cat > /tmp/jtest/FetchTest.java <<'JAVAEOF'
          import java.net.*;
          public class FetchTest {
              public static void main(String[] a) throws Exception {
                  String[] urls = {
                      "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom",
                      "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.pom"
                  };
                  for (String u : urls) {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(15000);
                          c.setRequestProperty("User-Agent", "Gradle/8.7");
                          System.out.println(c.getResponseCode() + " " + u);
                      } catch (Exception e) {
                          System.out.println("FAILED " + u + " : " + e);
                      }
                  }
              }
          }
          JAVAEOF
          javac -d /tmp/jtest /tmp/jtest/FetchTest.java && java -cp /tmp/jtest FetchTest
          echo "--- Gradle --debug plugin resolution ---"
          gradle help --debug > /tmp/gradle-debug.log 2>&1 || true
          grep -iE "Resource missing|HTTP|Could not|status code|dl.google.com|repo1.maven" /tmp/gradle-debug.log | head -60 || true
          echo "--- end diagnostic ---"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APKs
        run: gradle :app:assembleDebug

      - name: Verify APK signatures and metadata
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$BT/apksigner" verify "$apk" && echo "SIGNATURE OK: $apk"
            "$BT/aapt" dump badging "$apk" | head -3
          done

      - name: Rename APKs
        run: |
          VERSION="${{ inputs.version || '1.2.0' }}"
          cd app/build/outputs/apk/debug
          for f in *.apk; do echo "found: $f"; done
          mv app-armeabi-v7a-debug.apk "convarchive-${VERSION}-debug-armeabi-v7a.apk"
          mv app-arm64-v8a-debug.apk "convarchive-${VERSION}-debug-arm64-v8a.apk"
          mv app-universal-debug.apk "convarchive-${VERSION}-debug-universal.apk"
          ls -la convarchive-*.apk

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version || '1.2.0' }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION - Conversation Archive for Android" \
            --notes "Conversation Archive v$VERSION - local-first Android app to capture, import, archive, and export conversations from Google Gemini, Google AI Studio, and Google Jules. No accounts, no API keys, no telemetry; everything stays on the device. IMPORTANT: these are DEBUG builds signed with the Android debug key. Android will warn about an unknown developer on install - that is expected for a debug build. Install the universal APK." \
            app/build/outputs/apk/debug/convarchive-*.apk
